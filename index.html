<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisdom Keeper · Turn videos into wisdom you live by</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Cormorant Garamond", serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        color: #3b322a;
        background:
          radial-gradient(circle at 20% 20%, #fdf6e9, transparent 60%),
          radial-gradient(circle at 80% 80%, #f6e7cf, transparent 60%),
          linear-gradient(135deg, #f7efe0, #efe3cd);
        background-size: 200% 200%;
        animation: breathe 18s ease-in-out infinite;
      }

      @keyframes breathe {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 0% 0%; }
      }

      .card {
        position: relative;
        background: rgba(255, 253, 247, 0.94);
        border: 1px solid rgba(160, 130, 90, 0.35);
        border-radius: 8px;
        padding: 52px 44px;
        max-width: 640px;
        width: 100%;
        text-align: center;
        box-shadow:
          0 1px 0 rgba(255,255,255,0.7) inset,
          0 30px 60px rgba(90, 70, 40, 0.18);
        animation: fadeIn 1.4s ease;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(160, 130, 90, 0.25);
        border-radius: 4px;
        pointer-events: none;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .quill {
        width: 84px; height: 84px;
        margin: 0 auto 10px auto;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212,175,110,0.35), transparent 70%);
        animation: glow 6s ease-in-out infinite;
      }
      @keyframes glow {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .quill svg { width: 44px; height: 44px; }

      h1 {
        font-family: "Dancing Script", cursive;
        font-size: 46px; font-weight: 700;
        color: #7a5c2e; margin-bottom: 4px; line-height: 1.1;
      }

      .tagline {
        font-size: 19px; font-style: italic;
        color: #8a7350; margin-bottom: 22px;
      }

      .quote {
        font-size: 18px; font-style: italic;
        color: #6b5638; min-height: 50px;
        margin-bottom: 26px; transition: opacity 0.8s ease; line-height: 1.5;
      }

      .divider {
        width: 80px; height: 1px;
        background: rgba(160, 130, 90, 0.5);
        margin: 0 auto 26px auto; position: relative;
      }
      .divider::after {
        content: "❦";
        position: absolute; top: -13px; left: 50%;
        transform: translateX(-50%);
        color: #b08a4a; font-size: 18px;
        background: rgba(255, 253, 247, 0.94); padding: 0 8px;
      }

      /* Step blocks */
      .step {
        text-align: left;
        margin-bottom: 22px;
      }
      .step-label {
        display: flex; align-items: center; gap: 10px;
        font-size: 19px; color: #6b5638; margin-bottom: 8px;
      }
      .step-number {
        width: 28px; height: 28px; flex: none;
        border-radius: 50%;
        background: linear-gradient(135deg, #b08a4a, #8a6d34);
        color: #fffdf7; font-size: 15px;
        display: flex; align-items: center; justify-content: center;
      }

      input, textarea {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(140, 110, 70, 0.45);
        border-radius: 6px;
        font-size: 16px;
        font-family: "Cormorant Garamond", serif;
        background: #fffdf7;
        outline: none;
        transition: all 0.3s ease;
        color: #3b322a;
      }
      textarea { min-height: 150px; resize: vertical; line-height: 1.5; }

      input:focus, textarea:focus {
        border-color: #b08a4a;
        box-shadow: 0 0 0 4px rgba(176, 138, 74, 0.15);
      }

      .hint {
        font-size: 15px; font-style: italic;
        color: #a08c6a; margin-top: 6px;
      }

      button {
        width: 100%; margin-top: 8px;
        padding: 15px; border: none; border-radius: 6px;
        font-size: 19px; font-family: "Cormorant Garamond", serif;
        letter-spacing: 0.5px; color: #fffdf7; cursor: pointer;
        background: linear-gradient(135deg, #b08a4a, #8a6d34);
        transition: all 0.4s ease;
        box-shadow: 0 10px 24px rgba(138, 109, 52, 0.35);
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(138, 109, 52, 0.45);
      }

      .message {
        margin-top: 20px; font-size: 17px;
        font-style: italic; color: #6b5638; min-height: 24px;
      }

      .loader {
        display: none; margin-top: 20px;
        justify-content: center; gap: 8px;
      }
      .loader span {
        width: 10px; height: 10px; border-radius: 50%;
        background: #b08a4a; animation: bounce 0.6s infinite alternate;
      }
      .loader span:nth-child(2) { animation-delay: 0.2s; }
      .loader span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }

      .footer {
        margin-top: 30px; font-size: 15px;
        font-style: italic; color: #a08c6a;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="quill">
        <svg viewBox="0 0 24 24" fill="none" stroke="#7a5c2e" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 4C10 6 6 12 4 20l3-1c1-4 4-7 8-9" />
          <path d="M20 4c-3 4-6 6-10 8l3 3c4-2 6-5 7-8" />
          <path d="M4 20l4-4" />
        </svg>
      </div>

      <h1>Wisdom Keeper</h1>
      <p class="tagline">Turn the videos that move you into wisdom you live by.</p>

      <p class="quote" id="quote"></p>

      <div class="divider"></div>

      <!-- Step 1: YouTube link -->
      <div class="step">
        <div class="step-label">
          <span class="step-number">1</span>
          <span>Paste the link of a video that inspired you</span>
        </div>
        <input
          type="text"
          id="youtubeLink"
          placeholder="https://www.youtube.com/watch?v=..."
        />
      </div>

      <!-- Step 2: Transcript -->
      <div class="step">
        <div class="step-label">
          <span class="step-number">2</span>
          <span>Paste the video transcript</span>
        </div>
        <textarea
          id="transcript"
          placeholder="Paste the transcript of the video here..."
        ></textarea>
        <p class="hint">
          Tip: On YouTube, click “…” below the video → “Show transcript”, then copy and paste it here.
        </p>
      </div>

      <button onclick="handleClick()">Capture the Wisdom ✒</button>

      <div class="loader" id="loader">
        <span></span><span></span><span></span>
      </div>

      <p class="message" id="message"></p>

      <p class="footer">Wisdom Keeper · Notes for a more intentional life</p>
    </div>

    <script>
      const quotes = [
        "“Knowing is not enough; we must apply.” — Goethe",
        "“What we learn with pleasure we never forget.”",
        "“Small daily improvements lead to stunning results.”",
        "“The faintest ink is better than the best memory.”",
        "“Wisdom begins in reflection.”"
      ];

      let qIndex = 0;
      const quoteEl = document.getElementById("quote");

      function showQuote() {
        quoteEl.style.opacity = 0;
        setTimeout(() => {
          quoteEl.textContent = quotes[qIndex];
          quoteEl.style.opacity = 1;
          qIndex = (qIndex + 1) % quotes.length;
        }, 500);
      }
      showQuote();
      setInterval(showQuote, 5000);

      function handleClick() {
        const link = document.getElementById("youtubeLink").value;
        const transcript = document.getElementById("transcript").value;
        const message = document.getElementById("message");
        const loader = document.getElementById("loader");

        message.textContent = "";

        if (transcript.trim() === "") {
          message.textContent = "Please paste the transcript so I can capture its wisdom.";
          return;
        }

        loader.style.display = "flex";

        setTimeout(function () {
          loader.style.display = "none";
          message.textContent =
            "I have received " + transcript.trim().split(/\s+/).length +
            " words of wisdom. Next: turning them into your one-pager.";
        }, 2000);
      }
    </script>
  </body>
</html>
