<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Desk Agent</title>

    <!-- Professional Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ---------- Base setup ---------- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #1f2937;

        /* Animated gradient background */
        background: linear-gradient(-45deg, #ff6a88, #ff99ac, #6a11cb, #2575fc);
        background-size: 400% 400%;
        animation: gradientMove 15s ease infinite;
      }

      @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* ---------- Glass card ---------- */
      .card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 50px 40px;
        max-width: 560px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.4);

        /* Entrance animation */
        animation: fadeUp 0.9s ease;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ---------- Logo badge ---------- */
      .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px auto;
        border-radius: 20px;
        background: linear-gradient(135deg, #ff6a88, #6a11cb);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        box-shadow: 0 10px 25px rgba(106, 17, 203, 0.4);
      }

      /* ---------- Text ---------- */
      h1 {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #ff6a88, #6a11cb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
      }

      .subtitle {
        color: #4b5563;
        font-size: 15px;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      /* ---------- Input ---------- */
      .input-wrapper {
        position: relative;
        margin-bottom: 24px;
      }

      input {
        width: 100%;
        padding: 16px 18px;
        border: 2px solid #e5e7eb;
        border-radius: 14px;
        font-size: 15px;
        font-family: "Poppins", sans-serif;
        outline: none;
        transition: border 0.3s ease, box-shadow 0.3s ease;
      }

      input:focus {
        border-color: #6a11cb;
        box-shadow: 0 0 0 4px rgba(106, 17, 203, 0.15);
      }

      /* ---------- Button ---------- */
      button {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        font-family: "Poppins", sans-serif;
        color: white;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6a88, #6a11cb);
        background-size: 200% auto;
        transition: all 0.4s ease;
        box-shadow: 0 10px 25px rgba(106, 17, 203, 0.35);
      }

      button:hover {
        background-position: right center;
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(106, 17, 203, 0.45);
      }

      button:active {
        transform: translateY(0);
      }

      /* ---------- Message ---------- */
      .message {
        margin-top: 24px;
        font-size: 15px;
        color: #374151;
        min-height: 24px;
      }

      /* ---------- Loading dots ---------- */
      .loader {
        display: none;
        margin-top: 24px;
        justify-content: center;
        gap: 8px;
      }

      .loader span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #6a11cb;
        animation: bounce 0.6s infinite alternate;
      }

      .loader span:nth-child(2) { animation-delay: 0.2s; }
      .loader span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        to { transform: translateY(-12px); opacity: 0.5; }
      }

      /* ---------- Footer ---------- */
      .footer {
        margin-top: 30px;
        font-size: 12px;
        color: #9ca3af;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="logo">🎬</div>

      <h1>YouTube Desk Agent</h1>
      <p class="subtitle">
        Paste a YouTube link and get a beautiful, printable one-page desk
        reference — key ideas, actions, and daily reminders.
      </p>

      <div class="input-wrapper">
        <input
          type="text"
          id="youtubeLink"
          placeholder="https://www.youtube.com/watch?v=..."
        />
      </div>

      <button onclick="handleClick()">✨ Create My One-Pager</button>

      <div class="loader" id="loader">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p class="message" id="message"></p>

      <p class="footer">Built with ❤️ · YouTube Desk Agent</p>
    </div>

    <script>
      function handleClick() {
        const link = document.getElementById("youtubeLink").value;
        const message = document.getElementById("message");
        const loader = document.getElementById("loader");

        message.textContent = "";

        if (link.trim() === "") {
          message.textContent = "⚠️ Please paste a YouTube link first.";
          return;
        }

        // Show loading animation
        loader.style.display = "flex";

        // Simulate processing (we will make this real in later steps)
        setTimeout(function () {
          loader.style.display = "none";
          message.textContent = "✅ Link received! Processing will be added next.";
        }, 2000);
      }
    </script>
  </body>
</html>
